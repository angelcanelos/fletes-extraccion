name: Build y publicar app de escritorio

# Se ejecuta cada vez que se sube (push) a main. Para que la secretaria
# reciba una actualización de verdad, hay que subir a la vez un cambio en
# la versión del package.json (ver README: "Publicar una actualización").
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      # electron-builder publica el release ya como "publicado" (no borrador),
      # y GitHub exige que el tag de esa versión ya exista de verdad en el
      # repositorio antes de eso ("Published releases must have a valid tag").
      - name: Crear tag de versión
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "El tag $TAG ya existe, no se vuelve a crear."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Compilar y publicar release en GitHub
        run: npm run electron:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
