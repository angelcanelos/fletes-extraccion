name: Build y publicar app de escritorio

# PAUSADO A PROPÓSITO: mientras se termina de afinar la subida confiable
# del instalador (.exe de 125 MB) a GitHub Releases, este workflow ya NO
# se dispara solo con cada push a main — hay que lanzarlo a mano desde la
# pestaña Actions ("Run workflow"). Para reactivarlo automáticamente,
# vuelve a poner el bloque `push:` de abajo (comentado) en `on:`.
on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - '**.md'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      # Solo compila (genera el .exe, el .blockmap y latest.yml en release/);
      # no usa el publicador integrado de electron-builder, que resultó
      # poco confiable subiendo el instalador (125 MB) a GitHub en este
      # entorno: unas veces subía solo el blockmap, otras el .exe pero sin
      # latest.yml, etc. Subir los archivos con gh (el CLI oficial de
      # GitHub, ya instalado en los runners) es mucho más robusto.
      - name: Compilar la app de escritorio
        run: npm run electron:build

      - name: Crear el tag de esta versión
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "El tag $TAG ya existe, no se vuelve a crear."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Publicar el release en GitHub
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Ya existe un release para $TAG, se suben/actualizan los archivos."
            gh release upload "$TAG" \
              "release/Extraccion de Troceria Setup $VERSION.exe" \
              "release/Extraccion de Troceria Setup $VERSION.exe.blockmap" \
              "release/latest.yml" \
              --clobber
          else
            gh release create "$TAG" \
              "release/Extraccion de Troceria Setup $VERSION.exe" \
              "release/Extraccion de Troceria Setup $VERSION.exe.blockmap" \
              "release/latest.yml" \
              --title "$VERSION" \
              --notes "Actualización automática de Extracción de Trocería."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
