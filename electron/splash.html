<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Extracción de Trocería</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: linear-gradient(160deg, #0e2841 0%, #16324f 100%);
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    color: #fff;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
  }
  .contenedor {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 32px;
    text-align: center;
  }
  .logo-wrap {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    animation: pulso 2.2s ease-in-out infinite;
  }
  .logo-wrap img { width: 78%; height: 78%; object-fit: contain; }
  @keyframes pulso {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }
  h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.3px;
  }
  .estado {
    font-size: 13px;
    color: rgba(255,255,255,0.72);
    min-height: 18px;
    transition: opacity 120ms ease;
  }
  .detalle {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    min-height: 16px;
  }
  .barra-wrap {
    width: 220px;
    height: 5px;
    border-radius: 999px;
    background: rgba(255,255,255,0.14);
    overflow: hidden;
    margin-top: 4px;
  }
  .barra {
    height: 100%;
    width: 30%;
    border-radius: 999px;
    background: linear-gradient(90deg, #4c9a2a, #95ca58);
    transition: width 200ms ease;
  }
  .barra.indeterminada {
    width: 40%;
    animation: deslizar 1.3s ease-in-out infinite;
  }
  @keyframes deslizar {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(320%); }
  }
  .pie {
    position: absolute;
    bottom: 16px;
    font-size: 10.5px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.4px;
  }
</style>
</head>
<body>
  <div class="contenedor">
    <div class="logo-wrap"><img src="assets/logo.png" alt="logo"></div>
    <h1>Extracción de Trocería</h1>
    <div class="estado" id="estado">Iniciando…</div>
    <div class="detalle" id="detalle"></div>
    <div class="barra-wrap"><div class="barra indeterminada" id="barra"></div></div>
  </div>
  <div class="pie">Forestal Tezains</div>

  <script>
    const elEstado = document.getElementById('estado');
    const elDetalle = document.getElementById('detalle');
    const elBarra = document.getElementById('barra');

    if (window.actualizador) {
      window.actualizador.onEstado(({ texto, detalle }) => {
        elEstado.textContent = texto || '';
        elDetalle.textContent = detalle || '';
      });
      window.actualizador.onProgreso((porcentaje) => {
        elBarra.classList.remove('indeterminada');
        elBarra.style.width = Math.max(4, Math.min(100, porcentaje)) + '%';
      });
      window.actualizador.listo();
    }
  </script>
</body>
</html>
